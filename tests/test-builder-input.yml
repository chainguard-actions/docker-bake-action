name: Test bake with explicit builder input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx with named builder
        run: |
          docker buildx version
          docker buildx create --use --name named-builder --driver docker-container 2>/dev/null || true
          docker buildx inspect --bootstrap --builder named-builder

      - id: bake
        uses: .
        with:
          builder: named-builder
          source: ${{ github.workspace }}/tests/fixtures/builder-input
          targets: builderapp
          load: 'true'
          no-cache: 'true'
          provenance: 'false'
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: 'true'
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Assert image was built
        run: |
          echo "Checking if image exists..."
          if ! docker image inspect bake-builder-test:latest > /dev/null 2>&1; then
            echo "FAIL: expected image 'bake-builder-test:latest' not found"
            exit 1
          fi
          echo "PASS: image bake-builder-test:latest exists"

      - name: Assert metadata output is present
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata output is non-empty"
