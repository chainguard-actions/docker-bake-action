name: Test bake with vars input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create bake Dockerfile
        run: |
          mkdir -p /tmp/bake-vars-test
          cat > /tmp/bake-vars-test/Dockerfile <<'EOF'
          FROM alpine:3.19
          ARG TAG_SUFFIX=default
          RUN echo "TAG_SUFFIX=${TAG_SUFFIX}"
          EOF

      - name: Create bake definition file with variable
        run: |
          cat > /tmp/bake-vars-test/docker-bake.hcl <<'EOF'
          variable "TAG_SUFFIX" {
            default = "default"
          }
          target "varstest" {
            context    = "/tmp/bake-vars-test"
            dockerfile = "Dockerfile"
            tags       = ["bake-vars-test:${TAG_SUFFIX}"]
            output     = ["type=docker"]
            args = {
              TAG_SUFFIX = TAG_SUFFIX
            }
          }
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker

      - id: bake
        uses: .
        with:
          files: /tmp/bake-vars-test/docker-bake.hcl
          targets: varstest
          source: /tmp/bake-vars-test
          vars: |
            TAG_SUFFIX=custom
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          BUILDX_NO_DEFAULT_ATTESTATIONS: 'true'

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert image was built with custom tag
        run: |
          if ! docker image inspect bake-vars-test:custom > /dev/null 2>&1; then
            echo "FAIL: expected image bake-vars-test:custom to exist"
            exit 1
          fi
          echo "PASS"
