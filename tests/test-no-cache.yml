name: Test bake with no-cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: bake
        uses: .
        with:
          files: ${{ github.workspace }}/tests/fixtures/no-cache/docker-bake.hcl
          source: ${{ github.workspace }}/tests/fixtures/no-cache
          targets: nocacheapp
          no-cache: 'true'
          load: 'true'
          provenance: 'false'

      - name: Assert metadata output exists
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert image was loaded
        run: |
          if ! docker image inspect nocacheapp:test > /dev/null 2>&1; then
            echo "FAIL: expected image nocacheapp:test to be present"
            exit 1
          fi
          echo "PASS: image nocacheapp:test found"
