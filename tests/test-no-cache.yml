name: Test bake with no-cache option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Write bake file
        run: |
          cat > /tmp/bake-nocache.hcl << 'EOF'
          group "default" {
            targets = ["nocache-test"]
          }

          target "nocache-test" {
            dockerfile-inline = "FROM alpine:3.19\nRUN echo 'no cache build'"
            tags = ["nocache-test:latest"]
            output = ["type=cacheonly"]
          }
          EOF

      - id: bake
        uses: .
        with:
          files: /tmp/bake-nocache.hcl
          no-cache: 'true'
        continue-on-error: true

      - name: Assert no-cache build outcome
        env:
          OUTCOME: ${{ steps.bake.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: bake with no-cache succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: bake with no-cache failed gracefully (acceptable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
