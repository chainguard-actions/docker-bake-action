name: Test bake with no-cache
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name mybuilder --driver docker-container
          docker buildx inspect --bootstrap

      - name: Create bake file in workspace
        run: |
          cat > "$GITHUB_WORKSPACE/nocache-bake.hcl" <<'EOF'
          target "nocache-target" {
            dockerfile-inline = "FROM alpine\nRUN echo no-cache-build"
            output = ["type=cacheonly"]
          }
          EOF

      - id: bake
        uses: .
        with:
          source: '.'
          files: nocache-bake.hcl
          targets: nocache-target
          no-cache: 'true'
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'

      - name: Assert metadata output exists
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS"
