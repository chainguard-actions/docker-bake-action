name: Test bake with sbom input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: bake
        uses: .
        with:
          files: tests/fixtures/bake/docker-bake.hcl
          call: print
          sbom: 'false'
        continue-on-error: true

      - name: Assert bake ran with sbom input
        env:
          OUTCOME: ${{ steps.bake.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: bake call=print with sbom=false succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: bake failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
