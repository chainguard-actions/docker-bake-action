name: Test bake with sbom input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker

      - id: bake
        name: Run bake action with sbom disabled
        uses: .
        with:
          source: .
          files: tests/fixtures/sbom/docker-bake.hcl
          targets: sbomapp
          load: 'true'
          no-cache: 'true'
          sbom: 'false'
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          BUILDX_NO_DEFAULT_ATTESTATIONS: 'true'

      - name: Assert metadata output is non-empty
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS: metadata output is present"

      - name: Assert built image exists in Docker
        run: |
          if ! docker image inspect sbomapp:test > /dev/null 2>&1; then
            echo "FAIL: expected image sbomapp:test to be loaded into Docker"
            exit 1
          fi
          echo "PASS: image sbomapp:test found in Docker"
