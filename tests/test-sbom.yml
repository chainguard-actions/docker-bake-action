name: Test bake sbom input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: bake
        uses: .
        with:
          workdir: ./tests/fixtures/sbom
          source: .
          targets: sbomapp
          no-cache: 'true'
          sbom: 'false'

      - name: Assert metadata output is present
        env:
          ACTUAL: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS: metadata output is present with sbom=false"
