name: Test bake group targets
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Bake default group (img1 + img2) with load
        id: bake
        uses: .
        with:
          source: .
          files: tests/fixtures/group/docker-bake.hcl
          load: 'true'

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata output is non-empty"

      - name: Assert both images were loaded
        run: |
          FAIL=0
          for img in test-bake-img1:local test-bake-img2:local; do
            if docker image inspect "$img" > /dev/null 2>&1; then
              echo "PASS: image $img loaded"
            else
              echo "FAIL: image $img not found"
              FAIL=1
            fi
          done
          exit $FAIL
