name: Test bake with source context and vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Write bake file with variable
        run: |
          cat > /tmp/bake-vars.hcl << 'EOF'
          variable "TAG" {
            default = "latest"
          }

          group "default" {
            targets = ["varapp"]
          }

          target "varapp" {
            dockerfile-inline = "FROM alpine:3.19\nRUN echo 'vars test'"
            tags = ["varapp:${TAG}"]
            output = ["type=cacheonly"]
          }
          EOF

      - id: bake
        uses: .
        with:
          files: /tmp/bake-vars.hcl
          source: .
          vars: |
            TAG=v1.0.0
        continue-on-error: true

      - name: Assert source and vars outcome
        env:
          OUTCOME: ${{ steps.bake.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: bake with source=. and vars succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: bake with source/vars failed gracefully (acceptable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
