name: Test bake with builder and allow inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create bake Dockerfile
        run: |
          mkdir -p /tmp/bake-builder-test
          cat > /tmp/bake-builder-test/Dockerfile <<'EOF'
          FROM alpine:3.19
          RUN echo "builder allow test"
          EOF

      - name: Create bake definition file
        run: |
          cat > /tmp/bake-builder-test/docker-bake.hcl <<'EOF'
          target "buildertest" {
            context    = "/tmp/bake-builder-test"
            dockerfile = "Dockerfile"
            tags       = ["bake-builder-test:latest"]
            output     = ["type=docker"]
          }
          EOF

      - name: Set up Docker Buildx with named builder
        id: buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker-container
          install: true

      - id: bake
        uses: .
        with:
          files: /tmp/bake-builder-test/docker-bake.hcl
          targets: buildertest
          source: /tmp/bake-builder-test
          builder: ${{ steps.buildx.outputs.name }}
          allow: network.host
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          BUILDX_NO_DEFAULT_ATTESTATIONS: 'true'

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS"
