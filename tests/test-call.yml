name: Test bake with call check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx version || true
          docker buildx create --use --name test-builder-call --driver docker-container || docker buildx use test-builder-call || true
          docker buildx inspect --bootstrap || true

      - name: Create bake definition file
        run: |
          mkdir -p /tmp/bake-call-test
          cat > /tmp/bake-call-test/docker-bake.hcl <<'EOF'
          target "hello" {
            dockerfile-inline = "FROM alpine\nRUN echo hello"
            output = ["type=cacheonly"]
          }
          EOF

      - id: bake
        uses: .
        with:
          workdir: /tmp/bake-call-test
          files: /tmp/bake-call-test/docker-bake.hcl
          targets: hello
          call: check
          source: '.'

      - name: Assert bake with call check completed
        run: |
          echo "PASS: bake action with call=check completed successfully"
