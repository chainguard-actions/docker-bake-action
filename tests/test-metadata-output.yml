name: Test bake metadata output structure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - id: bake
        name: Run bake action with no-cache and pull flags
        uses: .
        with:
          source: .
          files: tests/fixtures/basic/docker-bake.hcl
          targets: myapp
          load: 'true'
          no-cache: 'true'
          pull: 'true'

      - name: Assert metadata is valid JSON
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          # Validate it is parseable JSON
          if ! echo "$METADATA" | python3 -m json.tool > /dev/null 2>&1; then
            echo "FAIL: metadata is not valid JSON"
            exit 1
          fi
          echo "PASS: metadata is valid JSON"

      - name: Assert metadata contains target name
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if ! echo "$METADATA" | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'myapp' in d, f'myapp not in keys: {list(d.keys())}'"; then
            echo "FAIL: metadata does not contain 'myapp' target key"
            exit 1
          fi
          echo "PASS: metadata contains 'myapp' target key"
