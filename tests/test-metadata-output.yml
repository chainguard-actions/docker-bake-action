name: Test bake metadata output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Write bake file
        run: |
          cat > /tmp/bake-metadata.hcl << 'EOF'
          group "default" {
            targets = ["meta-test"]
          }

          target "meta-test" {
            dockerfile-inline = "FROM alpine:3.19\nRUN echo 'metadata test'"
            tags = ["meta-test:latest"]
            output = ["type=cacheonly"]
          }
          EOF

      - id: bake
        uses: .
        with:
          files: /tmp/bake-metadata.hcl
        continue-on-error: true

      - name: Assert metadata output
        env:
          OUTCOME: ${{ steps.bake.outcome }}
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "outcome: $OUTCOME"
          echo "metadata: $METADATA"
          if [ "$OUTCOME" = "success" ]; then
            # On success, metadata should be a non-empty JSON object
            if [ -n "$METADATA" ]; then
              echo "PASS: metadata output is present: $METADATA"
              # Verify it's valid JSON
              if echo "$METADATA" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null; then
                echo "PASS: metadata is valid JSON"
              else
                echo "FAIL: metadata is not valid JSON"
                exit 1
              fi
            else
              echo "INFO: metadata output is empty (may be expected for cacheonly builds)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: bake failed gracefully (acceptable under harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
