name: Test bake metadata output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: bake
        uses: .
        with:
          files: tests/fixtures/bake/docker-bake.hcl
          targets: app
          load: 'true'
          no-cache: 'true'
        continue-on-error: true

      - name: Assert metadata output
        env:
          OUTCOME: ${{ steps.bake.outcome }}
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "outcome: $OUTCOME"
          echo "metadata: $METADATA"
          if [ "$OUTCOME" = "success" ]; then
            # On success, metadata should be non-empty JSON
            if [ -z "$METADATA" ]; then
              echo "FAIL: action succeeded but metadata output is empty"
              exit 1
            fi
            # Validate it looks like JSON
            if echo "$METADATA" | grep -q '{'; then
              echo "PASS: metadata output is non-empty and looks like JSON"
            else
              echo "FAIL: metadata output does not look like JSON: $METADATA"
              exit 1
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: bake failed gracefully (sentinel repo or missing buildx — metadata not expected)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
