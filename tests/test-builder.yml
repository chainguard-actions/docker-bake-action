name: Test bake with builder input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up named Docker Buildx builder
        id: setup-builder
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker
          install: true

      - id: bake
        name: Run bake action with explicit builder input
        uses: .
        with:
          source: .
          files: tests/fixtures/builder/docker-bake.hcl
          targets: builderapp
          load: 'true'
          no-cache: 'true'
          builder: ${{ steps.setup-builder.outputs.name }}
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          BUILDX_NO_DEFAULT_ATTESTATIONS: 'true'

      - name: Assert metadata output is non-empty
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS: metadata output is present"

      - name: Assert built image exists in Docker
        run: |
          if ! docker image inspect builderapp:test > /dev/null 2>&1; then
            echo "FAIL: expected image builderapp:test to be loaded into Docker"
            exit 1
          fi
          echo "PASS: image builderapp:test found in Docker"
