name: Test bake with builder input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up custom Docker Buildx builder
        id: setup-builder
        run: |
          docker buildx create --name custom-test-builder --driver docker-container --use
          docker buildx inspect --bootstrap custom-test-builder
          echo "name=custom-test-builder" >> "$GITHUB_OUTPUT"

      - id: bake
        uses: .
        with:
          source: '.'
          workdir: hardened/tests/fixtures/builder
          files: docker-bake.hcl
          targets: myapp
          builder: custom-test-builder

      - name: Assert metadata output is present
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS: metadata output is present with custom builder"

      - name: Clean up custom builder
        if: always()
        run: |
          docker buildx rm custom-test-builder || true
