name: Test docker bake with builder input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx and get builder name
        id: setup-builder
        run: |
          docker buildx version
          # Get the current default builder name
          BUILDER_NAME=$(docker buildx ls --format '{{.Name}}' | head -1)
          echo "builder-name=$BUILDER_NAME" >> $GITHUB_OUTPUT
          echo "Using builder: $BUILDER_NAME"

      - name: Create a simple bake file
        run: |
          cat > $GITHUB_WORKSPACE/docker-bake-builder.hcl << 'EOF'
          target "app" {
            dockerfile-inline = "FROM alpine:3.18\nRUN echo hello"
            tags = ["myapp:builder-test"]
          }
          EOF

      - id: bake
        uses: .
        with:
          files: docker-bake-builder.hcl
          targets: app
          load: 'true'
          push: 'false'
          builder: ${{ steps.setup-builder.outputs.builder-name }}
          source: ${{ github.workspace }}
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Assert metadata output exists
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert image was loaded
        run: |
          if ! docker image inspect myapp:builder-test > /dev/null 2>&1; then
            echo "FAIL: expected image myapp:builder-test to be present"
            exit 1
          fi
          echo "PASS: image myapp:builder-test found"
