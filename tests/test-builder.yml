name: Test bake with builder input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up named Docker Buildx builder
        run: |
          docker buildx create --name custom-builder --driver docker-container || true
          docker buildx inspect --builder custom-builder --bootstrap || true

      - id: bake
        uses: .
        with:
          source: '.'
          workdir: tests/fixtures/builder
          files: docker-bake.hcl
          targets: myapp
          builder: custom-builder

      - name: Assert metadata output is present
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS: metadata output is present"
