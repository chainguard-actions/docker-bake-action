name: Test bake builder input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        id: buildx
        with:
          install: true

      - name: Create a named builder instance
        id: create-builder
        run: |
          BUILDER_NAME="test-builder-$$"
          docker buildx create --name "$BUILDER_NAME" --use
          echo "name=$BUILDER_NAME" >> "$GITHUB_OUTPUT"

      - id: bake
        name: Run bake action with explicit builder input
        uses: .
        with:
          source: .
          files: tests/fixtures/basic/docker-bake.hcl
          targets: myapp
          load: 'true'
          no-cache: 'true'
          builder: ${{ steps.create-builder.outputs.name }}

      - name: Assert metadata output is non-empty
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS: metadata output is present (builder input accepted)"

      - name: Assert built image exists in Docker
        run: |
          if ! docker image inspect myapp:test > /dev/null 2>&1; then
            echo "FAIL: expected image myapp:test to be loaded into Docker"
            exit 1
          fi
          echo "PASS: image myapp:test found in Docker"

      - name: Clean up named builder
        if: always()
        run: |
          docker buildx rm "${{ steps.create-builder.outputs.name }}" || true
