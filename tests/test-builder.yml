name: Test bake with builder input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create custom builder
        run: |
          docker buildx create --name test-builder --use
          docker buildx inspect --bootstrap test-builder

      - id: bake
        uses: .
        with:
          files: ${{ github.workspace }}/tests/fixtures/builder/docker-bake.hcl
          source: ${{ github.workspace }}/tests/fixtures/builder
          targets: builderapp
          builder: test-builder
          load: 'true'
          provenance: 'false'

      - name: Assert metadata output exists
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert image was loaded
        run: |
          if ! docker image inspect builderapp:test > /dev/null 2>&1; then
            echo "FAIL: expected image builderapp:test to be present"
            exit 1
          fi
          echo "PASS: image builderapp:test found"

      - name: Cleanup builder
        if: always()
        run: docker buildx rm test-builder || true
