name: Test basic bake usage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Bake single target with load
        id: bake
        uses: .
        with:
          source: .
          files: tests/fixtures/simple/docker-bake.hcl
          targets: app
          load: 'true'
          set: |
            app.tags=test-bake-basic:local

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata output is non-empty"

      - name: Assert image was loaded
        run: |
          if ! docker image inspect test-bake-basic:local > /dev/null 2>&1; then
            echo "FAIL: image test-bake-basic:local not found in Docker"
            exit 1
          fi
          echo "PASS: image loaded successfully"
