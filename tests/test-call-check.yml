name: Test bake call check
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: bake
        uses: .
        with:
          workdir: ./tests/fixtures/check
          source: .
          targets: checkapp
          call: check

      - name: Assert step completed successfully
        run: |
          echo "PASS: bake call=check completed without error"
