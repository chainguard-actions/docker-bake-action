name: Test bake call=check (validation mode)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Bake with call=check (lint/validate only, no image built)
        id: bake
        uses: .
        with:
          source: .
          files: tests/fixtures/simple/docker-bake.hcl
          targets: app
          call: check

      - name: Assert step completed successfully
        run: |
          echo "PASS: bake call=check completed without error"
