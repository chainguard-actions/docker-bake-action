name: Test bake call=check (validate without build)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - id: bake
        name: Run bake action with call=check
        uses: .
        with:
          source: .
          files: tests/fixtures/call-check/docker-bake.hcl
          targets: checker
          call: check

      - name: Assert no image was loaded (check mode does not build)
        run: |
          if docker image inspect checker:test > /dev/null 2>&1; then
            echo "FAIL: image checker:test should NOT be loaded in check mode"
            exit 1
          fi
          echo "PASS: image checker:test not loaded (check mode validated only)"
