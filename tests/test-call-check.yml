name: Test bake with call=check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create bake Dockerfile
        run: |
          mkdir -p /tmp/bake-check-test
          cat > /tmp/bake-check-test/Dockerfile <<'EOF'
          FROM alpine:3.19
          RUN echo "Hello from check test!"
          EOF

      - name: Create bake definition file
        run: |
          cat > /tmp/bake-check-test/docker-bake.hcl <<'EOF'
          target "checkapp" {
            context    = "/tmp/bake-check-test"
            dockerfile = "Dockerfile"
            tags       = ["bake-check-test:latest"]
          }
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker

      - id: bake
        uses: .
        with:
          files: /tmp/bake-check-test/docker-bake.hcl
          targets: checkapp
          call: check
          source: /tmp/bake-check-test
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          BUILDX_NO_DEFAULT_ATTESTATIONS: 'true'

      - name: Assert step completed successfully
        run: |
          echo "Bake check call completed successfully"
          echo "PASS"
