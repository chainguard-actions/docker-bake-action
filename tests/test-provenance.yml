name: Test bake with provenance input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx create --use --name test-builder-provenance --driver docker-container || docker buildx use test-builder-provenance || true
          docker buildx inspect --bootstrap || true

      - id: bake
        uses: .
        with:
          source: '.'
          workdir: tests/fixtures/provenance
          files: docker-bake.hcl
          targets: myapp
          provenance: 'false'

      - name: Assert metadata output is present
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS: metadata output is present"
