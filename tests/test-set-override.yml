name: Test bake set override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: bake
        uses: .
        with:
          files: tests/fixtures/bake/docker-bake.hcl
          targets: app
          load: 'true'
          source: .
          set: |
            app.args.greeting=Overridden
            app.tags=bake-test-override:latest

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS: metadata output is present"

      - name: Assert overridden image exists
        run: |
          if ! docker image inspect bake-test-override:latest > /dev/null 2>&1; then
            echo "FAIL: expected image bake-test-override:latest to exist in Docker daemon"
            exit 1
          fi
          echo "PASS: image bake-test-override:latest exists (set override worked)"
