name: Test bake with set override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_SUMMARY: 'false'
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
      BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: bake
        uses: .
        with:
          files: ${{ github.workspace }}/tests/fixtures/set-override/docker-bake.hcl
          source: ${{ github.workspace }}/tests/fixtures/set-override
          targets: myimage
          load: 'true'
          provenance: 'false'
          set: |
            myimage.tags=myimage:overridden

      - name: Assert metadata output exists
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert overridden image was loaded
        run: |
          if ! docker image inspect myimage:overridden > /dev/null 2>&1; then
            echo "FAIL: expected image myimage:overridden to be present"
            exit 1
          fi
          echo "PASS: image myimage:overridden found"
