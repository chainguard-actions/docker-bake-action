name: Test bake with set override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create bake Dockerfile
        run: |
          mkdir -p /tmp/bake-set-test
          cat > /tmp/bake-set-test/Dockerfile <<'EOF'
          FROM alpine:3.19
          ARG MYARG=default
          RUN echo "MYARG=${MYARG}"
          EOF

      - name: Create bake definition file
        run: |
          cat > /tmp/bake-set-test/docker-bake.hcl <<'EOF'
          target "myapp" {
            context    = "/tmp/bake-set-test"
            dockerfile = "Dockerfile"
            tags       = ["bake-set-test:latest"]
            output     = ["type=docker"]
            args = {
              MYARG = "original"
            }
          }
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
        with:
          driver: docker

      - id: bake
        uses: .
        with:
          files: /tmp/bake-set-test/docker-bake.hcl
          targets: myapp
          set: |
            myapp.args.MYARG=overridden
          source: /tmp/bake-set-test
        env:
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
          BUILDX_NO_DEFAULT_ATTESTATIONS: 'true'

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert image was built
        run: |
          if ! docker image inspect bake-set-test:latest > /dev/null 2>&1; then
            echo "FAIL: expected image bake-set-test:latest to exist"
            exit 1
          fi
          echo "PASS"
