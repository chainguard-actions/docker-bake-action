name: Test bake set override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: bake
        uses: .
        with:
          source: .
          files: tests/fixtures/bake/docker-bake.hcl
          targets: hello
          load: 'true'
          push: 'false'
          set: |
            hello.args.greeting=overridden

      - name: Assert metadata output is set
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: metadata output is empty"
            exit 1
          fi
          echo "PASS: metadata output is set"

      - name: Assert image was loaded into Docker
        run: |
          if ! docker image inspect bake-test-hello:latest > /dev/null 2>&1; then
            echo "FAIL: image bake-test-hello:latest not found in Docker"
            exit 1
          fi
          echo "PASS: image bake-test-hello:latest found in Docker"
