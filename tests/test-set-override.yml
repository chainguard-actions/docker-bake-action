name: Test docker bake with set override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        run: |
          docker buildx version
          docker buildx ls

      - name: Create a bake file with a target
        run: |
          cat > $GITHUB_WORKSPACE/docker-bake-set.hcl << 'EOF'
          target "app" {
            dockerfile-inline = "FROM alpine:3.18\nRUN echo base"
            tags = ["myapp:original"]
          }
          EOF

      - id: bake
        uses: .
        with:
          files: docker-bake-set.hcl
          targets: app
          load: 'true'
          push: 'false'
          set: |
            app.tags=myapp:overridden
          source: ${{ github.workspace }}
        env:
          BUILDX_NO_DEFAULT_ATTESTATIONS: '1'
          DOCKER_BUILD_SUMMARY: 'false'
          DOCKER_BUILD_RECORD_UPLOAD: 'false'

      - name: Assert metadata output exists
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS"

      - name: Assert overridden image tag was loaded
        run: |
          if ! docker image inspect myapp:overridden > /dev/null 2>&1; then
            echo "FAIL: expected image myapp:overridden to be present after set override"
            exit 1
          fi
          echo "PASS: image myapp:overridden found"
