name: Test bake set input override
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - id: bake
        name: Run bake action with set override
        uses: .
        with:
          source: .
          files: tests/fixtures/set-override/docker-bake.hcl
          targets: webapp
          load: 'true'
          no-cache: 'true'
          set: |
            webapp.args.greeting=howdy
            webapp.tags=webapp:overridden

      - name: Assert metadata output is non-empty
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
        run: |
          echo "metadata: $METADATA"
          if [ -z "$METADATA" ]; then
            echo "FAIL: expected metadata output to be non-empty"
            exit 1
          fi
          echo "PASS: metadata output is present"

      - name: Assert overridden image tag exists in Docker
        run: |
          if ! docker image inspect webapp:overridden > /dev/null 2>&1; then
            echo "FAIL: expected image webapp:overridden to be loaded (set override not applied)"
            exit 1
          fi
          echo "PASS: image webapp:overridden found in Docker (set override applied)"
