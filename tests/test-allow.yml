name: Test bake allow input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - id: bake
        uses: .
        with:
          files: tests/fixtures/bake/docker-bake.hcl
          targets: app
          call: check
          allow: network.host
          source: .

      - name: Assert action completed without failure
        run: |
          echo "PASS: bake with allow=network.host completed successfully"
